name: praxy

services:
  postgres:
    # PostGIS-flavored image (geo columns/`near` queries, docs/research/geo-nearby.md) — same
    # Postgres 17 underneath, existing data volumes survive the swap unchanged (docs/self-host.md's
    # Upgrading section). Tag verified against a real pull, not guessed: postgis/postgis publishes
    # no arm64 manifest at all (any Postgres major, any PostGIS minor) — only amd64. `platform:`
    # pins it explicitly so an arm64 host (Apple Silicon Docker Desktop, an arm64 VPS with
    # qemu-user-static/binfmt configured) runs it under emulation instead of hard-failing with "no
    # matching manifest"; a bare arm64 Linux server with no emulation set up still can't run this
    # image at all — self-host on an amd64 host, or configure binfmt first.
    image: postgis/postgis:17-3.6-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: praxy
      POSTGRES_USER: praxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing .env — run ./up.sh once to generate secrets}
    volumes:
      - praxy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxy -d praxy"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__praxy: "Host=postgres;Port=5432;Database=praxy;Username=praxy;Password=${POSTGRES_PASSWORD}"
      # Signs short-lived OAuth JWTs and encrypts provider tokens at rest.
      PRAXY_SECRET_KEY: ${PRAXY_SECRET_KEY:-}
      # Set to your public origin to require the logged setup token for instance claim.
      PRAXY_PUBLIC_URL: ${PRAXY_PUBLIC_URL:-}
      # Only true when the "https" profile's Caddy sits in front (see below) — Caddy is the one
      # proxy in this stack, reached over the compose network rather than the public internet, so
      # trusting its X-Forwarded-* headers unconditionally is safe. Never enable this if the api
      # port is reachable directly (a direct-connecting client could spoof its own IP/scheme).
      Praxy__TrustForwardedHeaders: ${PRAXY_TRUST_FORWARDED_HEADERS:-false}
      # api runs inside this container, so its own 127.0.0.1 is not the host's — a function
      # container published to the *host's* loopback (the DockerExecutor default, correct only when
      # api runs bare on the host) would be unreachable from here. Instead function containers join
      # this same compose network (named explicitly below, not left to Compose's project-name-derived
      # default) and are reached by container IP. See docs/self-host.md's Functions section.
      Praxy__Functions__DockerNetwork: praxy-functions
      # Same reasoning as Functions' own DockerNetwork above, but a separate named network — a
      # site's container and a function's container should not be able to reach each other by
      # default, a smaller blast radius if either is compromised. See docs/self-host.md's Sites
      # section.
      Praxy__Sites__DockerNetwork: praxy-sites
      # The wildcard suffix a site's public hostname must end in. up.sh derives this from the
      # PRAXY_DOMAIN answer (sites.$PRAXY_DOMAIN) so the "asks one question" promise holds; the
      # sites.localhost default needs no configuration for local/plain-HTTP use — every modern
      # browser/OS resolver sends *.localhost straight to 127.0.0.1.
      Praxy__Sites__Domain: ${PRAXY_SITES_DOMAIN:-sites.localhost}
      # This instance's own GitHub App (Sites/Functions git integration) — unset by default, which
      # VcsOptions/GitHubAppJwt treat as "feature off" with a clean 422, not a crash. docs/self-host.md's
      # "Git integration" section walks through creating the App and getting these five values; set them
      # in deploy/.env (PRAXY_VCS_GITHUB_* — single underscores, a plain .env-file convention) and this
      # mapping carries them through to the double-underscore ASP.NET Core config path Praxy.Vcs binds
      # from. Found missing live 2026-08-25 — self-host.md documented setting these and restarting api as
      # sufficient, but nothing in this file actually passed them into the container until this line.
      Praxy__Vcs__GitHub__AppId: ${PRAXY_VCS_GITHUB_APPID:-}
      Praxy__Vcs__GitHub__ClientId: ${PRAXY_VCS_GITHUB_CLIENTID:-}
      Praxy__Vcs__GitHub__ClientSecret: ${PRAXY_VCS_GITHUB_CLIENTSECRET:-}
      Praxy__Vcs__GitHub__PrivateKey: ${PRAXY_VCS_GITHUB_PRIVATEKEY:-}
      Praxy__Vcs__GitHub__WebhookSecret: ${PRAXY_VCS_GITHUB_WEBHOOKSECRET:-}
    networks:
      - default
      - praxy-sites
    ports:
      # PRAXY_BIND defaults to 0.0.0.0 (direct plain-HTTP access — the local/no-domain case).
      # up.sh sets it to 127.0.0.1 whenever a domain is configured, so the api port is reachable
      # only from inside the host (Caddy reaches it via the compose network regardless, which
      # doesn't go through this host port mapping at all) — not relying on the host firewall alone,
      # since Docker's own iptables rules are known to bypass ufw for published ports.
      - "${PRAXY_BIND:-0.0.0.0}:${PRAXY_PORT:-8080}:8080"
    volumes:
      # Docker-outside-of-Docker for Phase 7 Functions: the api container builds and runs function
      # containers as siblings via the host's own Docker daemon. This is effectively root-equivalent
      # access to the host — anyone who can reach the api process can, in principle, control every
      # other container and the host filesystem through the socket. There is no sandboxed
      # alternative in this release; if that tradeoff is unacceptable for your deployment, comment
      # this line out (Functions will be unusable — every build/invoke call fails closed — but the
      # rest of Praxy is unaffected).
      - /var/run/docker.sock:/var/run/docker.sock

  # Optional reverse proxy for a public deployment: automatic HTTPS (Let's Encrypt) for
  # PRAXY_DOMAIN, forwarding to the api service over the compose network. Not started by default —
  # `docker compose --profile https up -d` after setting PRAXY_DOMAIN and
  # PRAXY_TRUST_FORWARDED_HEADERS=true in .env. See docs/self-host.md.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Deliberately not ${PRAXY_DOMAIN:?...} — Compose validates every service's required env
      # vars at parse time regardless of which profile is active, so a hard-require here broke
      # plain `docker compose up` (no --profile) for everyone, not just https users. up.sh
      # validates this is set before it ever passes --profile https instead.
      PRAXY_DOMAIN: ${PRAXY_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - praxy-caddy-data:/data
      - praxy-caddy-config:/config

volumes:
  praxy-pgdata:
  praxy-caddy-data:
  praxy-caddy-config:

networks:
  # Named explicitly (not left to Compose's default `<project>_default` naming, whose separator
  # varies by Compose version) so DockerExecutor has a fixed, documented value to join function
  # containers to — see the api service's Praxy__Functions__DockerNetwork above.
  default:
    name: praxy-functions
  # Sites' own network, separate from Functions' — see the api service's Praxy__Sites__DockerNetwork
  # above and docs/self-host.md's Sites section.
  praxy-sites:
    name: praxy-sites
