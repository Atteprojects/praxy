name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each job below only does its real work when files it actually covers changed — a docs-only PR
# no longer spends 16 minutes rebuilding and testing the API.
#
# Why the jobs still *run* (and gate their steps) rather than being skipped with a job-level `if:`,
# or filtered out with a workflow-level `on.<event>.paths:` — both of which would read more
# cleanly: `main` is a protected branch whose required status checks are "Build and test API",
# "Build console" and "Build and test Flutter SDK", with `enforce_admins` on. A workflow filtered
# out by `paths:` never reports those contexts at all, so GitHub leaves them Pending forever and
# the PR becomes unmergeable with no admin override. Keeping every job running means every required
# context always reports; the skipped work costs a runner spin-up (~15s) instead of ~16 minutes.
# If the required-check list or `enforce_admins` ever changes, job-level `if:` becomes safe and is
# the nicer shape — until then, don't "tidy" this into one.
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      console: ${{ steps.filter.outputs.console }}
      flutter: ${{ steps.filter.outputs.flutter }}
      nextjs: ${{ steps.filter.outputs.nextjs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Every area also watches this workflow file: a CI change must be validated by the jobs
          # it changes, not skipped by its own filter.
          filters: |
            api:
              - 'src/**'
              - 'tests/**'
              # Praxy.Sdk lives in the solution and its generated surface comes from the document,
              # so both the SDK itself and the generator belong to this job's blast radius.
              - 'sdk/dotnet/**'
              - 'sdk/generator/**'
              - 'docs/openapi/v1.json'
              - 'Praxy.sln'
              - 'Directory.Build.props'
              - '.github/workflows/ci.yml'
            console:
              - 'console/**'
              # The console's generated API types are derived from this snapshot — a backend PR
              # that changes it must still run the staleness check below, even when it touches no
              # file under console/.
              - 'docs/openapi/v1.json'
              - '.github/workflows/ci.yml'
            flutter:
              - 'sdk/flutter/**'
              # The generator emits into praxy_core, so a change to it can make that output stale.
              - 'sdk/generator/**'
              # praxy_core's generated server surface is derived from this snapshot, exactly like
              # the console's types above — a backend PR that changes it must run the staleness
              # check even when it touches nothing under sdk/flutter/.
              - 'docs/openapi/v1.json'
              - '.github/workflows/ci.yml'
            nextjs:
              - 'sdk/js/**'
              - '.github/workflows/ci.yml'

  api:
    name: Build and test API
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.api == 'true'

      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.api == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        if: needs.changes.outputs.api == 'true'
        run: dotnet restore Praxy.sln

      # Praxy.Sdk's service surface is generated from docs/openapi/v1.json. Same regenerate-and-diff
      # gate the Dart target gets, run here because this is the job with the .NET toolchain — the
      # generator itself is zero-dependency Node, so it needs nothing installed.
      - name: Check the generated C# surface is current
        if: needs.changes.outputs.api == 'true'
        run: |
          node sdk/generator/bin/generate.mjs --target csharp
          git add --intent-to-add sdk/dotnet/Praxy.Sdk/Services/Generated
          git diff --exit-code -- sdk/dotnet/Praxy.Sdk/Services/Generated \
            || { echo "::error::Praxy.Sdk's generated services are stale. Run 'node sdk/generator/bin/generate.mjs' and commit."; exit 1; }

      - name: Build
        if: needs.changes.outputs.api == 'true'
        run: dotnet build Praxy.sln --no-restore --configuration Release

      # Testcontainers needs a Docker daemon — ubuntu-latest runners have one preinstalled at
      # /var/run/docker.sock, so no services: Postgres container here; Testcontainers manages its own.
      - name: Test
        if: needs.changes.outputs.api == 'true'
        run: dotnet test Praxy.sln --no-build --configuration Release

      - name: No API changes
        if: needs.changes.outputs.api != 'true'
        run: echo "No changes under src/, tests/, sdk/dotnet/, sdk/generator/ or the solution — nothing to build."

  console:
    name: Build console
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.console == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.console == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install
        if: needs.changes.outputs.console == 'true'
        run: npm ci --prefix console

      # Mirrors OpenApiDocumentTests' snapshot check on the .NET side: regenerate from the
      # committed docs/openapi/v1.json and fail if that doesn't match the committed generated
      # output — "forgot to regenerate" fails here instead of shipping a console lying about the
      # API it's built against.
      - name: Check generated API types are current
        if: needs.changes.outputs.console == 'true'
        run: npm run check:api-types --prefix console

      - name: Build
        if: needs.changes.outputs.console == 'true'
        run: npm run build --prefix console

      - name: No console changes
        if: needs.changes.outputs.console != 'true'
        run: echo "No changes under console/ — nothing to build."

  flutter-sdk:
    name: Build and test Flutter SDK
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.flutter == 'true'

      # praxy_flutter/example are real Flutter packages (flutter test needs the Flutter SDK's
      # bundled Dart, not just dart-lang/setup-dart) — praxy_core/praxy_codegen are pure Dart but
      # share the same pub workspace, resolved together below.
      - uses: subosito/flutter-action@v2
        if: needs.changes.outputs.flutter == 'true'
        with:
          channel: stable

      - name: Install
        if: needs.changes.outputs.flutter == 'true'
        run: dart pub get
        working-directory: sdk/flutter

      - name: Test pure-Dart packages
        if: needs.changes.outputs.flutter == 'true'
        run: dart test praxy_core praxy_codegen
        working-directory: sdk/flutter

      # `dart test` only ever loads `lib/`, so a package's CLI entry point can be missing from the
      # repo entirely and every test still passes — which is exactly what happened: the root
      # .gitignore's .NET `bin/` rule swallowed `praxy_codegen/bin/praxy_codegen.dart`, and the
      # documented `dart run praxy_codegen` had never worked in a fresh clone. Running each CLI is
      # the only check that actually loads `bin/`.
      - name: Smoke-test the Dart CLIs
        if: needs.changes.outputs.flutter == 'true'
        run: dart run praxy_codegen --help
        working-directory: sdk/flutter

      # Same gate, same reasoning as the console's `check:api-types`: regenerate into the working
      # tree and diff, so the check can never disagree with what a real regeneration would write.
      # The generator is zero-dependency Node, which every runner already has, so this job needs no
      # extra toolchain to run it — and it formats only the Dart it just wrote, with the Dart that
      # is installed here.
      - name: Check the generated Dart surface is current
        if: needs.changes.outputs.flutter == 'true'
        run: |
          node sdk/generator/bin/generate.mjs --target dart
          # --intent-to-add first: `git diff` does not report untracked files, so without it a
          # newly registered service whose generated file was never committed would regenerate
          # here and sail through the check while missing from the repo entirely.
          git add --intent-to-add sdk/flutter/praxy_core/lib/src/services/generated
          git diff --exit-code -- sdk/flutter/praxy_core/lib/src/services/generated \
            || { echo "::error::praxy_core's generated services are stale. Run 'node sdk/generator/bin/generate.mjs' and commit."; exit 1; }

      - name: Test the SDK generator
        if: needs.changes.outputs.flutter == 'true'
        run: node --test sdk/generator/test/*.test.mjs

      - name: Test Flutter packages
        if: needs.changes.outputs.flutter == 'true'
        run: flutter test praxy_flutter example
        working-directory: sdk/flutter

      - name: Analyze
        if: needs.changes.outputs.flutter == 'true'
        run: dart analyze .
        working-directory: sdk/flutter

      - name: No Flutter SDK changes
        if: needs.changes.outputs.flutter != 'true'
        run: echo "No changes under sdk/flutter/ — nothing to build."

  nextjs-sdk:
    name: Build and test Next.js SDK
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.nextjs == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.nextjs == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install
        if: needs.changes.outputs.nextjs == 'true'
        run: npm ci --prefix sdk/js

      # Dependency order matters: react/nextjs/codegen type-resolve against core's/react's built
      # dist/*.d.ts, not their TS source — this is npm workspaces, not a project-references build.
      - name: Build
        if: needs.changes.outputs.nextjs == 'true'
        run: npm run build --prefix sdk/js

      - name: Test
        if: needs.changes.outputs.nextjs == 'true'
        run: npm run test --prefix sdk/js

      - name: Typecheck packages
        if: needs.changes.outputs.nextjs == 'true'
        run: npm run typecheck --prefix sdk/js

      # The example app isn't one of the shipped packages (no build/test script of its own to run
      # here — it needs a live local Praxy instance + real project ids, verified manually per
      # docs/handoff/nextjs-sdk-prompt.md's "done means"), but it must still type-check cleanly.
      - name: Typecheck example app
        if: needs.changes.outputs.nextjs == 'true'
        run: npm run typecheck --prefix sdk/js/examples/nextjs

      - name: No Next.js SDK changes
        if: needs.changes.outputs.nextjs != 'true'
        run: echo "No changes under sdk/js/ — nothing to build."
